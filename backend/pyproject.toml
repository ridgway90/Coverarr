[project]
name = "coverarr"
version = "0.1.0"
description = "Central poster, overlay and collection manager for Plex, Jellyfin and Emby"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.151,<1",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "httpx>=0.28",
    # 2026.10.19 drops the compromised eMudhra/emSign intermediates (GHSA-6q48-6c7w-9gw2);
    # httpx and the Wikidata queries both verify against this bundle.
    "certifi>=2026.10.19",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pillow>=13.0",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coverarr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]
